<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>中2理科 からだ攻略</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 左メニュー / 中央コンテンツ / 右メモ欄(画像添付可)。スマホは下タブ + メモはシート表示 */
:root{
  --bg:#eef4f2; --surface:#ffffff; --surface2:#e6efec; --line:#cfdcd8;
  --fg:#12302a; --fg2:#4d6a63; --accent:#12805a; --accent-fg:#ffffff; --accent-soft:#d3efe3;
  --iodine:#5a3fc8; --iodine-soft:#e5defa; --btb:#f0b90b; --btb-soft:#fbefc0;
  --ok:#12805a; --ok-soft:#d3efe3; --ng:#cf3e22; --ng-soft:#fbdcd4;
  --k1:#1b7f5c; --k2:#5a3fc8; --k3:#d98a00; --k4:#c2386b; --k5:#2071c7; --k6:#c2562a; --k7:#0f8f9e;
  --fgreen:#46b27a; --fgreenl:#cdeedb; --fblue:#5b8fe0; --fbluel:#d6e5fb; --fred:#e0554a; --fpink:#f3a1b8; --fpinkl:#fbd9e3;
  --fyellow:#f2c94c; --fpurple:#6a4fd0; --fpurplel:#d9d0f6; --fgray:#c9d3d0; --fpaper:#fbfdfc; --fbrown:#b98957;
  --shadow:0 1px 2px rgba(18,48,42,.08),0 6px 18px rgba(18,48,42,.06);
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --fontb:"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1716; --surface:#15231f; --surface2:#1c2f2a; --line:#2b423c;
  --fg:#e5f2ee; --fg2:#98b5ad; --accent:#3fcf98; --accent-fg:#06231a; --accent-soft:#17382e;
  --iodine:#a592f5; --iodine-soft:#2a2350; --btb:#f4c62f; --btb-soft:#3a3210;
  --ok:#3fcf98; --ok-soft:#17382e; --ng:#ff8468; --ng-soft:#3d1f19;
  --k1:#3fcf98; --k2:#a592f5; --k3:#f0b43a; --k4:#f07aa5; --k5:#6fb1ff; --k6:#f09064; --k7:#4fd2e0;
  --fgreen:#3fa56c; --fgreenl:#24473a; --fblue:#5b8fe0; --fbluel:#22385a; --fred:#e0665c; --fpink:#d98aa3; --fpinkl:#4a2a38;
  --fyellow:#d9b13b; --fpurple:#8a73ec; --fpurplel:#32295c; --fgray:#34504a; --fpaper:#1b2c27; --fbrown:#a67a4c;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1716; --surface:#15231f; --surface2:#1c2f2a; --line:#2b423c;
  --fg:#e5f2ee; --fg2:#98b5ad; --accent:#3fcf98; --accent-fg:#06231a; --accent-soft:#17382e;
  --iodine:#a592f5; --iodine-soft:#2a2350; --btb:#f4c62f; --btb-soft:#3a3210;
  --ok:#3fcf98; --ok-soft:#17382e; --ng:#ff8468; --ng-soft:#3d1f19;
  --k1:#3fcf98; --k2:#a592f5; --k3:#f0b43a; --k4:#f07aa5; --k5:#6fb1ff; --k6:#f09064; --k7:#4fd2e0;
  --fgreen:#3fa56c; --fgreenl:#24473a; --fblue:#5b8fe0; --fbluel:#22385a; --fred:#e0665c; --fpink:#d98aa3; --fpinkl:#4a2a38;
  --fyellow:#d9b13b; --fpurple:#8a73ec; --fpurplel:#32295c; --fgray:#34504a; --fpaper:#1b2c27; --fbrown:#a67a4c;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fontb);font-size:15px;line-height:1.7;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font);margin:0;line-height:1.35;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--iodine);outline-offset:2px}
.sr{position:absolute;left:-9999px}

/* shell */
#app{display:grid;grid-template-columns:208px minmax(0,1fr) 300px;gap:16px;max-width:1360px;margin:0 auto;padding-block:12px;min-height:100%}
#side{position:sticky;top:12px;align-self:start;height:calc(100vh - 24px);display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 10px;box-shadow:var(--shadow);overflow:auto}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 12px;font-family:var(--font);font-weight:900;font-size:16px;line-height:1.2}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--fg2)}
.nv{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:12px;font-weight:700;font-size:14px;color:var(--fg2);width:100%}
.nv svg{width:20px;height:20px;flex:none}
.nv:hover{background:var(--surface2)}
.nv.on{background:var(--accent);color:var(--accent-fg)}
.sp{flex:1}
#main{min-width:0;padding-bottom:84px}
#memo{position:sticky;top:12px;align-self:start;height:calc(100vh - 24px);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.mh{padding:12px 14px;border-bottom:1px solid var(--line);font-family:var(--font);font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mh small{display:block;font-weight:500;color:var(--fg2);font-size:12px;font-family:var(--fontb)}
.mlist{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.note{background:var(--surface2);border-radius:12px;padding:8px 10px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.note img{display:block;max-width:100%;border-radius:8px;margin-top:6px}
.note .d{display:flex;justify-content:space-between;color:var(--fg2);font-size:11px;margin-top:4px}
.mform{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mform textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:8px;font:inherit;font-size:14px}
.mrow{display:flex;gap:8px;align-items:center}
.pv{max-width:100%;max-height:120px;border-radius:8px}
#memoBtn{display:none}
#tabs{display:none}

/* topbar (mobile) */
#top{display:none}

/* common */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.pg{display:flex;flex-direction:column;gap:14px}
.pt{font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--fg2);font-size:13.5px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.g{background:var(--surface2);color:var(--fg)}
.btn.o{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.btn.w{background:var(--ng);color:#fff}
.btn.i{background:var(--iodine);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.s{min-height:36px;padding:6px 12px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;background:var(--surface2);color:var(--fg2)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.ng{background:var(--ng-soft);color:var(--ng)}
.chip.iod{background:var(--iodine-soft);color:var(--iodine)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tab{display:flex;gap:6px;flex-wrap:wrap}
.tab button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.tab button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.num{font-variant-numeric:tabular-nums}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.bubble{background:var(--accent-soft);color:var(--fg);border-radius:16px;padding:12px 14px;position:relative;font-weight:700}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{background:var(--surface2);border-radius:14px;padding:10px;text-align:center}
.st b{display:block;font-family:var(--font);font-size:22px;line-height:1.2}
.st span{font-size:11.5px;color:var(--fg2)}
.lvl{display:flex;flex-direction:column;gap:4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring i{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:13px}
.tcard{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--accent)}
.tcard h3{font-size:16px}
.big{font-family:var(--font);font-weight:900;font-size:34px;line-height:1}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.bdg{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:var(--surface2);font-size:12.5px;font-weight:700;color:var(--fg2);opacity:.55}
.bdg.on{opacity:1;background:var(--btb-soft);color:var(--fg)}
.bdg svg{width:18px;height:18px}

/* figures */
.figbox{background:var(--fpaper);border:1px solid var(--line);border-radius:14px;padding:8px;overflow-x:auto}
svg.fig{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
.fig .ln{fill:none;stroke:var(--fg);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fig .ln2{fill:none;stroke:var(--fg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fig .th{fill:none;stroke:var(--fg2);stroke-width:1}
.fig .ldr{stroke:var(--fg2);stroke-width:1.2}
.fig .tdot{fill:var(--fg)}
.fig text{fill:var(--fg);font-family:var(--fontb);font-size:11.5px}
.fig .tb{font-weight:700;font-size:12.5px}
.fig .tc{text-anchor:middle}
.fig .lb{fill:var(--surface);stroke:var(--fg);stroke-width:1.3}
.fig .lb.hl{fill:var(--btb);stroke:var(--fg)}
.fig .lt{text-anchor:middle;font-weight:800;font-size:11.5px}
.fig .lt.hl{fill:#1a1a1a}
.fig .fgr{fill:var(--fgreen)} .fig .fgl{fill:var(--fgreenl)} .fig .fbu{fill:var(--fblue)} .fig .fbl{fill:var(--fbluel)}
.fig .frd{fill:var(--fred)} .fig .fpk{fill:var(--fpink)} .fig .fpl{fill:var(--fpinkl)} .fig .fyl{fill:var(--fyellow)}
.fig .fpu{fill:var(--fpurple)} .fig .fpp{fill:var(--fpurplel)} .fig .fgy{fill:var(--fgray)} .fig .fpa{fill:var(--fpaper)} .fig .fbr{fill:var(--fbrown)}
.fig .sbu{stroke:var(--fblue)} .fig .srd{stroke:var(--fred)} .fig .spk{stroke:var(--fpink)} .fig .syl{stroke:var(--fyellow)}
.fig .w{stroke-width:3} .fig .w2{stroke-width:5}
.fig .dash{stroke-dasharray:5 4}
.flow{display:flex;flex-direction:column;gap:10px}
.flr{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.flr b{background:var(--surface);border:1.5px solid var(--fg2);border-radius:8px;padding:2px 8px;font-size:12.5px}
.flr b.q{background:var(--btb);color:#1a1a1a;border-color:var(--fg)}
.flr i{font-style:normal;color:var(--fg2)}
.flr .t{font-weight:800;font-size:12.5px;margin-right:4px}

/* quiz */
.qwrap{display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qtxt{font-size:17px;font-weight:700;line-height:1.7}
.qno{font-family:var(--font);font-weight:900;color:var(--accent)}
.ch{display:flex;flex-direction:column;gap:8px}
.cb{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;font-weight:600;min-height:48px}
.cb i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12.5px;font-weight:900}
.cb:hover{border-color:var(--accent)}
.cb.sel{border-color:var(--iodine);background:var(--iodine-soft)}
.cb.ok{border-color:var(--ok);background:var(--ok-soft)}
.cb.ng{border-color:var(--ng);background:var(--ng-soft)}
.fillin{display:flex;gap:8px}
.fillin input{flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.fb{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-soft)} .fb.ng{background:var(--ng-soft)}
.fb h3{font-size:17px}
.exp{background:var(--surface);border-radius:12px;padding:10px 12px;font-size:14.5px}
.nav20{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.nav20 button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;min-height:34px;font-weight:800;font-size:12.5px;padding:0}
.nav20 .dn{background:var(--iodine-soft);border-color:var(--iodine)}
.nav20 .fl{box-shadow:inset 0 -4px 0 var(--btb)}
.nav20 .cur{outline:3px solid var(--fg)}
.timer{font-family:var(--font);font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;background:var(--fg);color:var(--bg);border-radius:10px;padding:2px 12px}
.timer.low{background:var(--ng);color:#fff}
.sticky{position:sticky;top:8px;z-index:5;background:var(--bg);padding-block:6px}

/* result */
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.score .big{font-size:56px;color:var(--accent)}
.hb{display:grid;grid-template-columns:104px 1fr 60px;gap:8px;align-items:center;font-size:13px;margin-block:6px}
.hb .bar{height:14px}
.hb em{font-style:normal;font-weight:800;text-align:right}
.hb.k1 .bar>i{background:var(--k1)}.hb.k2 .bar>i{background:var(--k2)}.hb.k3 .bar>i{background:var(--k3)}.hb.k4 .bar>i{background:var(--k4)}.hb.k5 .bar>i{background:var(--k5)}.hb.k6 .bar>i{background:var(--k6)}.hb.k7 .bar>i{background:var(--k7)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
svg.ch2{width:100%;height:auto;display:block}
.ch2 text{fill:var(--fg2);font-size:11px;font-family:var(--fontb)}
.ch2 .gl{stroke:var(--line);fill:none}
.ch2 .ax{stroke:var(--fg2);fill:none}
.ch2 .tt{fill:var(--fg);font-weight:800}
.wr{border-left:5px solid var(--ng);padding-left:12px;display:flex;flex-direction:column;gap:8px}
details.q{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px}
details.q summary{cursor:pointer;font-weight:700}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf i{position:absolute;top:-12px;width:9px;height:14px;opacity:.9;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}.bar>i{transition:none}.cardf{transition:none!important}}

/* lesson */
.lsec{display:flex;flex-direction:column;gap:10px}
.lsec h3{font-size:18px;display:flex;gap:8px;align-items:center}
.lsec h3 b{background:var(--accent);color:var(--accent-fg);border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px;padding:0 6px}
.lsec p{margin:0}
.key{background:var(--btb-soft);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14.5px}
.key small{display:block;font-weight:800;color:var(--fg2);font-size:11.5px;letter-spacing:.06em}
.mn{background:var(--iodine-soft);border-radius:12px;padding:10px 12px;font-size:14.5px}
.mn small{display:block;font-weight:800;color:var(--iodine);font-size:11.5px;letter-spacing:.06em}
.ut{width:100%;border-collapse:collapse;font-size:13.5px}
.ut th,.ut td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.ut th{background:var(--surface2)}
.tw{overflow-x:auto}
.ucard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px}
.ucard .dot{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900;font-family:var(--font);flex:none}
.k1.dot{background:var(--k1)}.k2.dot{background:var(--k2)}.k3.dot{background:var(--k3)}.k4.dot{background:var(--k4)}.k5.dot{background:var(--k5)}.k6.dot{background:var(--k6)}.k7.dot{background:var(--k7)}
.dot{color:#fff}

/* cards */
.scene{perspective:900px}
.cardf{position:relative;min-height:230px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.cardf.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;border:2px solid var(--line);background:var(--surface);font-size:19px;font-weight:700}
.face.b{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}
.rsb p{margin:0 0 10px}
.rs{color:var(--ng);font-weight:800;border-bottom:2px dotted var(--ng);cursor:pointer;padding:0 2px}
.cover .rs:not(.open){color:transparent;background:var(--fpink);border-radius:4px;border-bottom-color:transparent}
.cover .rs.open{background:transparent}

/* data */
.json{width:100%;min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);padding:8px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;z-index:60;max-width:90vw;text-align:center}
.lvup{background:linear-gradient(120deg,var(--iodine),var(--k4));color:#fff;border-radius:16px;padding:12px 16px;font-weight:900;text-align:center}

@media (max-width:1100px){
  #app{grid-template-columns:208px minmax(0,1fr)}
  #memo{position:fixed;right:0;top:0;bottom:0;width:min(360px,92vw);height:auto;align-self:stretch;max-height:100%;border-radius:18px 0 0 18px;z-index:40;transform:translateX(105%);transition:transform .25s}
  #memo.open{transform:none}
  #memoBtn{display:inline-flex}
}
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr);padding-block:0}
  #side{display:none}
  #top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px 0}
  #top .brand{padding:0}
  #tabs{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}

    case 'result': h = vResult(); break;
    case 'cards': ctx = 'cards'; h = vCards(); break;
    case 'stats': ctx = 'stats'; h = vStats(); break;
    case 'data': h = vData(); break;
    default: h = vHome();
  }
  $('main').innerHTML = h;
  k = curNav();
  var els = document.querySelectorAll('[data-nav]'), i;
  for (i = 0; i < els.length; i++) { var on = els[i].getAttribute('data-nav') === k; els[i].className = els[i].className.replace(/ on/g, '') + (on ? ' on' : ''); if (on) { els[i].setAttribute('aria-current', 'page'); } else { els[i].removeAttribute('aria-current'); } }
  memoRender();
  var tb = document.querySelectorAll('.thbtn'), moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>';
  for (i = 0; i < tb.length; i++) { tb[i].setAttribute('aria-label', isDark() ? 'ライトモードにする' : 'ダークモードにする'); tb[i].firstChild.outerHTML = isDark() ? ic('sun') : moon; }
  var tw = document.querySelectorAll('.thlab'); for (i = 0; i < tw.length; i++) { tw[i].textContent = isDark() ? 'ライト' : 'ダーク'; }
}
function go(v, p) {
  if (Z && Z.timer) { clearInterval(Z.timer); }
  if (v !== 'quiz') { if (Z && !Z.fin && Z.mode === 'exam') { Z = null; } }
  V = { v: v }; if (v === 'lesson') { V.k = p; }
  if (v === 'cards') { V.tab = 'flash'; V.cat = 'all'; CT = null; }
  memoOpen = false; memoImg = '';
  render(); window.scrollTo(0, 0);
}
function unitIds(k) {
  var all = QIDS.filter(function (id) { return QMAP[id].c === k; }), wr = [], rest = [], r = rng(Date.now());
  all.forEach(function (id) { var x = S.qs[id]; if (x && x.c < x.n) { wr.push(id); } else { rest.push(id); } });
  return shuffle(wr, r).concat(shuffle(rest, r)).slice(0, 5);
}

/* ---- イベント ---- */
function act(a, p, el) {
  var q, parts;
  switch (a) {
    case 'go': go(p); break;
    case 'lesson': go('lesson', p); break;
    case 'read': if (!S.units[p]) { S.units[p] = today(); addXP(20); touchDay(); var nb = badgeCheck(); toast('読了しました! +20XP' + (nb.length ? ' バッジ:' + nb.join('、') : '')); save(); } render(); break;
    case 'unitq': startSession('unit', unitIds(p), '確認問題:' + catOf(p).n, 0); break;
    case 'weak': var w = weakIds(10); if (!w.length) { toast('まちがえた問題はまだありません'); } else { startSession('retry', w, '苦手問題の復習', 0); } break;
    case 'start': parts = p.split('|'); startSession(parts[0], testIds(+parts[1]), '第' + parts[1] + '回 ' + TITLES[+parts[1]], +parts[1]); break;
    case 'retry': var at = findAttempt(+p); if (at) { startSession('retry', at.items.filter(function (x) { return !x.ok; }).map(function (x) { return x.q; }), 'まちがい復習', 0); } break;
    case 'res': V = { v: 'result', id: +p }; render(); window.scrollTo(0, 0); break;
    case 'pick': pickChoice(+p); break;
    case 'sub': submitFill(); break;
    case 'next': if (Z.i >= Z.qs.length - 1) { finish(); } else { Z.i++; Z.msg = ''; render(); window.scrollTo(0, 0); } break;
    case 'next2': if (Z.i < Z.qs.length - 1) { Z.i++; render(); window.scrollTo(0, 0); } break;
    case 'prev': if (Z.i > 0) { Z.i--; render(); window.scrollTo(0, 0); } break;
    case 'jump': Z.i = +p; render(); window.scrollTo(0, 0); break;
    case 'jumpr': var el2 = $('r' + p); if (el2) { el2.scrollIntoView({ behavior: 'smooth', block: 'start' }); } break;
    case 'flag': Z.flags[Z.i] = !Z.flags[Z.i]; render(); break;
    case 'ask': Z.ask = p || ''; render(); break;
    case 'quitYes': if (Z.timer) { clearInterval(Z.timer); } Z.fin = true; save(); go('home'); break;
    case 'submitYes': finish(); break;
    case 'ctab': V.tab = p; render(); break;
    case 'ccat': V.cat = p; CT = null; render(); break;
    case 'cardsGo': cardsGo(p); break;
    case 'cnew': CT = null; render(); window.scrollTo(0, 0); break;
    case 'flip': CT.flip = !CT.flip; render(); break;
    case 'cok': cardAnswer(true); break;
    case 'cng': cardAnswer(false); break;
    case 'rs': el.className = el.className.indexOf(' open') >= 0 ? 'rs' : 'rs open'; break;
    case 'rsCover': var b = $('rsb'); if (b) { var cv = b.className.indexOf('cover') >= 0; b.className = 'card rsb' + (cv ? '' : ' cover'); var sp = b.querySelectorAll('.rs'), j; for (j = 0; j < sp.length; j++) { sp[j].className = 'rs'; } } break;
    case 'theme': S.theme = isDark() ? 'light' : 'dark'; applyTheme(); save(); render(); break;
    case 'memoOpen': memoOpen = true; memoRender(); break;
    case 'memoClose': memoOpen = false; memoRender(); break;
    case 'memoAdd': memoAdd(); break;
    case 'memoDel': if (S.notes[ctx]) { S.notes[ctx].splice(+p, 1); if (!S.notes[ctx].length) { delete S.notes[ctx]; } save(); memoRender(); } break;
    case 'memoImgDel': memoImg = ''; memoRender(); break;
    case 'exportJSON': exportJSON(false); break;
    case 'copyJSON': exportJSON(true); break;
    case 'importJSON': importText($('jtext').value); break;
    case 'reset': $('rstbox').innerHTML = '<span class="sub">本当にすべて消しますか?</span> <button class="btn w" data-a="resetYes">消去する</button> <button class="btn g" data-a="go" data-p="data">やめる</button>'; break;
    case 'resetYes': S = defState(); applyTheme(); save(); toast('消去しました'); go('home'); break;
  }
}
function init() {
  load(); applyTheme();
  var sideN = '', tabN = '';
  NAVS.forEach(function (n) {
    sideN += '<button class="nv" data-nav="' + n[0] + '" data-a="go" data-p="' + n[0] + '">' + ic(n[2]) + '<span>' + n[1] + '</span></button>';
    if (n[0] !== 'data') { tabN += '<button data-nav="' + n[0] + '" data-a="go" data-p="' + n[0] + '">' + ic(n[2]) + '<span>' + n[1] + '</span></button>'; }
  });
  $('navs').innerHTML = sideN; $('tabs').innerHTML = tabN;
  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== document && !(t.getAttribute && t.getAttribute('data-a'))) { t = t.parentNode; }
    if (!t || t === document) { return; }
    act(t.getAttribute('data-a'), t.getAttribute('data-p'), t);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'fillv') { e.preventDefault(); submitFill(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.className && String(e.target.className).indexOf('cardf') >= 0) { e.preventDefault(); act('flip'); }
  });
  $('mfile').addEventListener('change', function (e) { readImage(e.target.files && e.target.files[0]); e.target.value = ''; });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'jfile' && e.target.files && e.target.files[0]) {
      var fr = new FileReader(); fr.onload = function () { importText(String(fr.result)); }; fr.readAsText(e.target.files[0]); e.target.value = '';
    }
  });
  render();
}
init();

</script>
